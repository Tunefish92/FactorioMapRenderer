services:
  map:
    # `docker compose pull` fetches the prebuilt image; `docker compose up -d --build` builds it
    # from this checkout instead.
    image: ${FMR_IMAGE:-ghcr.io/tunefish92/factoriomaprenderer:latest}
    build:
      context: .
      dockerfile: src/FactorioMapRenderer/Dockerfile
    container_name: factorio-map
    restart: unless-stopped
    # The admin password comes from admin.env, which is passed on exactly as written ("raw"):
    # every character is allowed, also "$", "#", quotes and spaces, which Compose would change in
    # .env or in this file. Without it the container stops with a message (`docker compose logs`).
    # Needs Docker Compose 2.30 or newer.
    env_file:
      - path: admin.env
        required: false
        format: raw
    environment:
      # Highest rendered zoom level (5-10). 9 is 16 px per game tile; each level less renders
      # about four times faster and needs a quarter of the disk space.
      FMR_MAX_ZOOM: ${FMR_MAX_ZOOM:-9}
      # The image brings Factorio's headless server. Only for a save that is newer, a newer one is
      # downloaded from factorio.com (once per version); false never contacts factorio.com.
      FMR_DOWNLOAD_HEADLESS: ${FMR_DOWNLOAD_HEADLESS:-true}
      # Owner of the data folder on the host; the app runs as this user.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    ports:
      - "${FMR_PORT:-8080}:8080"
    volumes:
      - ${FMR_DATA_HOST_PATH:-./map-data}:/data
      # Optional: the saves folder of your Factorio server, for the "Folder" source in the page.
      # - /path/to/factorio/saves:/saves:ro
      # Optional: your Factorio installation for Linux, read-only. Reads the saves instead of the
      # downloaded headless server and gives the map the icons and names of exactly your game.
      # - /path/to/Factorio:/game:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
